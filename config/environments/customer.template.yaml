# 脱敏客户参数模板。复制为 customer.local.yaml 后填写。
# 禁止提交 customer.local.yaml、凭证、kubeconfig 和真实私钥。
architecture: amd64
cluster_name: bm-poc
namespace: cpaas-system

bootstrap:
  host_ip: 192.0.2.10
  kubeconfig: /secure/path/bootstrap-kubeconfig
  registry_address: 192.0.2.10:11443
  platform_host: global.example.invalid

registry:
  address: registry.example.invalid:11443
  project: tkestack
  tls_verify: true
  image_tag: v4.3.2-1-1.34.5-3
  base_image: registry.example.invalid:11443/tkestack/baremetal-base-image:v4.3.2-1-1.34.5-3
  base_image_iso: registry.example.invalid:11443/tkestack/baremetal-base-image-iso:v4.3.2-1-1.34.5-3

control_plane:
  replicas: 3
  endpoint:
    mode: External # External or Internal
    host: 192.0.2.20
    port: 6443
    vrid: null
  inventories: [bm-cp-01, bm-cp-02, bm-cp-03]

workers:
  replicas: 3
  inventories: [bm-worker-01, bm-worker-02, bm-worker-03]

network:
  pods_cidr: 100.3.0.0/16
  services_cidr: 100.4.0.0/16
  kube_ovn_join_cidr: 100.5.0.0/16
  dns_servers: [192.0.2.53]
  gateway: 192.0.2.1

hosts:
  install_device: /dev/elemental-install-target
  target_platform: linux/amd64
  emulate_tpm: true
  ssh_authorized_keys_file: /secure/path/id_ed25519.pub

# 外部注入，不在此文件填写值：
# REGISTRY_USERNAME / REGISTRY_PASSWORD
# PLATFORM_ADMIN_PASSWORD
# BMC credentials (if used by site operations)
