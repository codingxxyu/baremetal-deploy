name: static-validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install pyyaml
      - run: python tests/check_templates.py
      - run: bash -n scripts/*.sh scripts/lib/*.sh
      - run: grep -RInE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|build-harbor\.alauda\.cn|authKey:|password:' . --exclude-dir=.git --exclude='*.md' && exit 1 || true
