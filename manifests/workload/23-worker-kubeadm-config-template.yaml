# ROLE: workload/23-worker-kubeadm-config-template.yaml
# Parameterized copy of manifests/templates. Render with role-specific variables.
# Verify every field against the ACP 4.3.2 CRD schema before apply.

apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-worker-kubeadm-config
  namespace: cpaas-system
spec:
  template:
    spec:
      format: cloud-config
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            provider-id: PROVIDER_ID