# ROLE: global/15-control-plane.yaml
# Parameterized copy of manifests/templates. Render with role-specific variables.
# Verify every field against the ACP 4.3.2 CRD schema before apply.

apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: ${CLUSTER_NAME}-control-plane
  namespace: cpaas-system
spec:
  replicas: ${CONTROL_PLANE_REPLICAS}
  version: ${KUBERNETES_VERSION}
  kubeadmConfigSpec:
    format: cloud-config
    users:
      - name: boot
        sshAuthorizedKeys:
          - ${SSH_AUTHORIZED_KEY}
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          provider-id: PROVIDER_ID
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: BaremetalMachineTemplate
      name: ${CLUSTER_NAME}-control-plane-machine-template